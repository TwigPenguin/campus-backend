# 数据库连接地址（campus_db 是数据库名，如果不存在，程序会自动创建）
spring.datasource.url=jdbc:mysql://localhost:3306/campus_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
# 数据库账号
spring.datasource.username=root
# 数据库密码（改成你自己安装MySQL时设置的密码）
spring.datasource.password=123456
# 数据库驱动
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 配置：update 表示如果表不存在，会自动帮你建表；如果有新属性，会自动加列
spring.jpa.hibernate.ddl-auto=update
# 在控制台打印 SQL 语句，方便你观察
spring.jpa.show-sql=true

# 时间按字符串返回，前端可以直接显示
# 改成 Jackson 3.x 的正确路径
spring.jackson.datatype.datetime.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Shanghai

# 物品图片上传大小
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB